[project]
name = "podkop-watchdog-tests"
version = "1.0.0"
description = "Test suite for the podkop-watchdog OpenWrt service (the service itself is POSIX shell)."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "shellcheck-py>=0.10",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.pyright]
include = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
